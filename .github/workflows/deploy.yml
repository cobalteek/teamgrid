name: Deploy TeamGrid

on:
  push:
    branches:
      - master

concurrency:
  group: teamgrid-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cobalteek.tech/teamgrid/
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            exec 9>/tmp/teamgrid-production-deploy.lock
            flock -w 900 9

            cd /var/www/teamgrid

            echo "Load environment"
            set -a
            . ./.env
            set +a

            echo "Pull latest changes"
            git pull origin master

            echo "Install dependencies"
            if ! npm ci; then
              echo "Retry dependency installation after clearing Nuxt cache"
              rm -rf node_modules/.cache/nuxt
              npm ci
            fi

            echo "Update database schema"
            npx prisma db push

            echo "Build application"
            npm run build

            test -f .output/server/index.mjs

            echo "Restart application"
            pm2 restart teamgrid --update-env
            pm2 save

            echo "Deployment completed"
