name: Deploy TeamGrid Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: teamgrid-develop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://cobalteek.tech/teamgrid-dev/

    steps:
      - name: Deploy to develop
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "Wait for another develop deployment to finish"
            exec 9>/var/lock/teamgrid-dev-deploy.lock
            flock -w 1800 9

            cd /var/www/teamgrid-dev

            echo "Check latest develop commit"
            git fetch origin develop

            target_commit=$(git rev-parse origin/develop)
            state_file=/var/lib/teamgrid-dev-deploy/deployed-commit
            deployed_commit=$(cat "$state_file" 2>/dev/null || true)

            if [ "$target_commit" = "$deployed_commit" ]; then
              echo "Commit $target_commit is already deployed"
              exit 0
            fi

            git merge --ff-only origin/develop

            echo "Install dependencies"
            npm ci

            echo "Load environment"
            set -a
            . ./.env
            set +a

            echo "Build application"
            npm run build

            echo "Apply database schema"
            npx prisma db push

            echo "Restart develop application"
            PORT=3001 HOST=127.0.0.1 NODE_ENV=production pm2 restart teamgrid-dev --update-env
            pm2 save

            echo "Record deployed commit"
            install -d -m 0755 /var/lib/teamgrid-dev-deploy
            printf '%s\n' "$target_commit" > "$state_file"

            echo "Develop deployment completed"
