name: Deploy TeamGrid Develop

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: teamgrid-develop-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://cobalteek.tech/teamgrid-dev/

    steps:
      - name: Deploy to develop
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /var/www/teamgrid-dev

            echo "Pull latest develop changes"
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop

            echo "Install dependencies"
            npm ci

            echo "Load environment"
            set -a
            . ./.env
            set +a

            echo "Build application"
            npm run build

            echo "Apply database schema"
            npx prisma db push

            echo "Restart develop application"
            pm2 restart teamgrid-dev --update-env

            echo "Develop deployment completed"
